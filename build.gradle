plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all', '--output', file('src/main/generated/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main {
    resources { srcDirs 'src/main/generated' }
    java {
        // Fabric datagen providers are not ported: the generated resources already live in
        // src/main/generated and datagen is not needed at runtime.
        exclude 'pers/solid/mishang/uc/data/MishangucDataGeneration.java'
        exclude 'pers/solid/mishang/uc/data/MishangucBlockTagProvider.java'
        exclude 'pers/solid/mishang/uc/data/MishangucItemTagProvider.java'
        exclude 'pers/solid/mishang/uc/data/MishangucBlockLootTableProvider.java'
        exclude 'pers/solid/mishang/uc/data/MishangucModelProvider.java'
        exclude 'pers/solid/mishang/uc/data/MishangucRecipeProvider.java'
        exclude 'pers/solid/mishang/uc/data/MishangucTagBuilder.java'
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras: the -forge artifact only bundles the API as a nested jar (META-INF/jars),
    // which Gradle does not expose on the compile classpath, so we depend on -common for compilation.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issue_tracker      : mod_issue_tracker,
            mod_display_url        : mod_display_url,
    ]
    inputs.properties replaceProperties

    // This is a native Forge port: the leftover Fabric metadata must not ship inside the jar,
    // otherwise Sinytra Connector can pick the jar up as a Fabric mod and clash on the mod id.
    exclude 'fabric.mod.json'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'mishanguc.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
